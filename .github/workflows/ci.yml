name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the jobs only read the repository. See docs/security-decisions.md S-008.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a full commit SHA: a tag can be moved to malicious code, a SHA cannot.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm typecheck
      # The tests use a small fixture curriculum, so the real one is validated here.
      # The API refuses to start when a content file is wrong.
      - run: pnpm curriculum:check
      # The API e2e test starts PostgreSQL with Testcontainers; hosted runners ship Docker.
      - run: pnpm test

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      # The lockfile must satisfy the policies in pnpm-workspace.yaml (release age, trust, build allow-list).
      # Scripts are skipped here; this job only checks what would be installed.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Fails on any high or critical advisory that is not explicitly accepted in pnpm-workspace.yaml.
      - run: pnpm audit --audit-level high
      - run: npm audit --package-lock-only --audit-level high
        working-directory: infra/docker/runner-nest
      # npm has no release-age setting, so the runner image's lockfile gets the same rules here.
      - run: node scripts/check-npm-lock.mjs infra/docker/runner-nest/package-lock.json
