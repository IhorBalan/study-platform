name: Curriculum checks

# Runs every task's hidden checks against its solution (must pass) and its starter
# (must fail), in the same sandbox a learner's submission gets. See docs/decisions.md D-136.
on:
  push:
    branches: [main]
    paths:
      - 'curriculum/**'
      # Lesson text and review cards cannot change a task check. CI's verify job validates them.
      - '!curriculum/**/lesson.md'
      - '!curriculum/**/cards.yaml'
      - 'infra/docker/runner/**'
      - 'infra/docker/runner-nest/**'
      - 'infra/compose/lab.compose.yaml'
      - 'apps/bridge/**'
      - 'packages/curriculum/**'
      - 'packages/lab-cli/**'
      - '.github/workflows/curriculum.yml'
  pull_request:
    paths:
      - 'curriculum/**'
      # Lesson text and review cards cannot change a task check. CI's verify job validates them.
      - '!curriculum/**/lesson.md'
      - '!curriculum/**/cards.yaml'
      - 'infra/docker/runner/**'
      - 'infra/docker/runner-nest/**'
      - 'infra/compose/lab.compose.yaml'
      - 'apps/bridge/**'
      - 'packages/curriculum/**'
      - 'packages/lab-cli/**'
      - '.github/workflows/curriculum.yml'

concurrency:
  group: curriculum-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  task-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the sandbox images
        run: pnpm lab images
      - name: Start the practice services
        run: pnpm lab up postgres valkey aws mailpit
      - name: Check every task against its solution and starter
        run: pnpm curriculum:verify --no-skip
        env:
          VERIFY_JOBS: 4
