name: orders

services:
  api:
    build: ./api
    environment:
      PORT: 3000
      # TODO: no password in this file, and is the host name right?
      DATABASE_URL: postgres://orders:orders123@localhost:5432/orders
    ports:
      - '3000:3000'
    # TODO: this only waits for the container to start, not for PostgreSQL to accept connections.
    depends_on:
      - db

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders123
      POSTGRES_DB: orders
    ports:
      - '5432:5432'
    # TODO: the data lives in the container's writable layer and dies with it.
    # TODO: no healthcheck.

  # TODO: add the optional admin tool.
