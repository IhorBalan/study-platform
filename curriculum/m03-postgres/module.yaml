title: PostgreSQL and data modelling
summary: >-
  You can write the SQL that real features need, design a schema whose constraints keep the data
  correct, choose and verify indexes with EXPLAIN, reason about transactions, isolation and locks,
  change a large live table without downtime, and use Postgres from Node with pg and Drizzle
  without pool exhaustion or N+1 queries.
