- id: rest-url-names-thing
  type: concept
  front: "In REST, what does the URL name and what does the method say?"
  back: "The URL names a resource (a noun, plural for collections: `/projects/42`). The method says what to do with it."
  skills: [api-rest-design]
- id: cancel-action-shape
  type: concept
  front: "How do you model an action like \"cancel an order\" without putting a verb in the URL?"
  back: "As a state change (`PATCH /orders/7` with a new `status`) or by creating a sub-resource (`POST /orders/7/cancellation`) when the action has its own data or rules."
  skills: [api-rest-design]
- id: idempotent-methods
  type: concept
  front: "Is `PATCH` idempotent?"
  back: "Not by definition. A merge patch that sets fields gives the same result twice, but a patch that appends or increments does not, so a client must not retry `PATCH` blindly the way it can retry `PUT` or `DELETE`."
  skills: [api-rest-design]
- id: put-vs-patch
  type: comparison
  front: "`PUT` vs `PATCH`"
  back: "`PUT` replaces the whole resource with the body and is idempotent. `PATCH` changes part of it, for JSON often as a merge patch where `null` removes a field."
  skills: [api-rest-design]
- id: created-location
  type: cloze
  front: "A successful create returns `201 Created` and the {{...}} header with the new resource's URL."
  back: "`Location`"
  skills: [api-rest-design]
- id: 409-conflict-use
  type: concept
  front: "When is `409 Conflict` the right status?"
  back: "The request is well-formed, but the current state does not allow it: a duplicate unique value, a stale version, an action already done."
  skills: [api-rest-design]
- id: 404-hides-existence
  type: concept
  front: "Why might an API answer `404` instead of `403` for a resource the caller may not see?"
  back: "A `403` confirms that the resource exists. `404` hides that, which matters when ids can be guessed."
  skills: [api-rest-design]
- id: problem-type-member
  type: concept
  front: "In an RFC 9457 problem document, which member should a client switch on, and why not `detail`?"
  back: "`type`, a URI that identifies the kind of error. `detail` is human text for this occurrence and may change any time."
  skills: [api-rest-design]
- id: field-errors-extension
  type: snippet
  front: "Write a problem document for a validation error that a form library can map to fields."
  back: |-
    ```json
    { "type": "https://api.example.com/problems/validation", "title": "Request body is invalid",
      "status": 400, "errors": [{ "pointer": "/email", "detail": "must be a valid email" }] }
    ```
  skills: [api-rest-design]
- id: 200-with-success-false
  type: concept
  front: "What goes wrong with `200 OK` and `{ \"success\": false }` for errors?"
  back: "Everything that reads status codes (fetch libraries, proxies, monitoring, retries) treats the failure as a success."
  skills: [api-rest-design]
