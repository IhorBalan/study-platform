- id: design-rate-limiter
  type: concept
  front: "Interview: design a rate limiter. Which algorithm, and where does its state live with several API instances?"
  back: "A token bucket or sliding window, keyed per client, with its state in a shared store such as Valkey and the check-and-update in one atomic Lua script."
  skills: [rate-limiting]
- id: fixed-window-flaw
  type: concept
  front: What is the flaw of a fixed-window rate limiter?
  back: "A client can use the full limit at the end of one window and again at the start of the next: twice the limit in a moment."
  skills: [rate-limiting]
- id: sliding-log-cost
  type: comparison
  front: Sliding window log vs sliding window counter
  back: "The log stores a timestamp per request and is exact but costs up to `limit` entries per client. The counter weights two fixed windows: two numbers, approximate."
  skills: [rate-limiting]
- id: token-bucket
  type: term
  front: Token bucket
  back: "Up to `capacity` tokens refilled at a steady rate; each request takes one. Allows short bursts while holding the long-run rate."
  skills: [rate-limiting]
- id: in-memory-limiter-scaled
  type: concept
  front: What happens to an in-memory rate limiter when you run three API instances?
  back: "Each instance counts separately, so a client gets up to three times the limit."
  skills: [rate-limiting]
- id: limiter-atomicity
  type: concept
  front: Why must the rate limit check and update be one atomic step?
  back: "Otherwise two instances can both read 99 of 100 and both allow a request, and a burst gets far past the limit."
  skills: [rate-limiting]
- id: status-429
  type: cloze
  front: "Over the limit, answer {{429 Too Many Requests with a Retry-After header}} so clients know how long to wait."
  back: "429 Too Many Requests with a Retry-After header"
  skills: [rate-limiting]
- id: where-to-enforce
  type: concept
  front: Where do rate limits belong in a typical deployment?
  back: "Coarse per-IP limits at the edge; per-user, per-key and per-plan limits in the app; strict limits on sensitive routes such as login."
  skills: [rate-limiting]
- id: trust-proxy
  type: concept
  front: Why can a per-IP limiter behind a load balancer put every client into one bucket?
  back: "req.ip is the balancer's address unless Express trusts the proxy and reads the client from X-Forwarded-For."
  skills: [rate-limiting]
- id: fail-open-closed
  type: comparison
  front: Rate limiter failing open vs failing closed
  back: "Fail open (allow) when the limit protects capacity. Fail closed (reject) when it is a security control, such as login attempts."
  skills: [rate-limiting]
- id: rejected-not-counted
  type: concept
  front: Why should a sliding-window limiter not record rejected requests?
  back: "A client that keeps retrying would keep its window full and stay blocked forever."
  skills: [rate-limiting]
