  You can decide where files belong, use the AWS SDK v3 against S3 or an S3-compatible store, let
  browsers upload and download directly with presigned URLs that you validate afterwards, move large
  files with multipart upload, and keep a bucket private, tidy and cheap with lifecycle rules.
