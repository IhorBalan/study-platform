title: Kubernetes
summary: >-
  You can explain what Kubernetes does and when a small team should not use it, read and write
  the manifests for a Node API (Deployment, Service, Gateway or Ingress, ConfigMap, Secret,
  probes, HPA, PodDisruptionBudget), make deploys zero-downtime, debug a failing rollout, and
  describe how Helm, Kustomize and CI fit around it. Theory first; hands-on with kind is optional.
kind: core
effort: M
