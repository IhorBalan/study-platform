  - { id: k8s-workloads, title: "Pods, Deployments and other workloads" }
  - { id: k8s-networking, title: "Services, Ingress and the Gateway API" }
  - { id: k8s-config, title: "ConfigMaps, Secrets, resources and namespaces" }
  - { id: k8s-health-scaling, title: "Probes, graceful shutdown and scaling" }
  - { id: k8s-delivery, title: Shipping a Node API to Kubernetes }
