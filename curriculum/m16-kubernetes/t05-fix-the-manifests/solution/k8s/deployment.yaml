apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: shop
  labels:
    app.kubernetes.io/name: catalog
spec:
  # No replicas: the HPA owns the count.
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog
    spec:
      terminationGracePeriodSeconds: 35 # preStop 10 s + up to 20 s to finish requests + margin
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the image says USER node, a name the kubelet cannot verify
        runAsGroup: 1000
      containers:
        - name: catalog
          image: ghcr.io/acme/catalog:8c1f4d2
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: catalog-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: catalog-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
