  - { id: sd-data-design, title: "Data models, consistency and access paths" }
  - { id: sd-scaling, title: Scaling reads and writes }
  - { id: sd-async-architecture, title: Asynchronous architecture and scheduled work }
  - { id: sd-availability, title: "Availability, failure and recovery" }
  - { id: sd-service-boundaries, title: "Monoliths, modules and service boundaries" }
  - { id: sd-design-docs, title: "Design documents, ADRs and design reviews" }
  - { id: capstone-delivery, title: Scoping and delivering a production-shaped product }
