title: System design and capstone
summary: >-
  You can design a backend that a small team can build and run: turn a vague product into
  requirements and numbers, choose a data model and consistency per operation, scale reads and
  writes in the right order, make work asynchronous and safe to retry, plan for failure and
  recovery, draw module boundaries, write and review a design document, and then build and
  report on a small multi-tenant SaaS that pulls the earlier modules together.
kind: core
effort: L
