packages:
  - apps/*
  - packages/*

catalog:
  typescript: 7.0.2
  turbo: ^2.11.12
  oxlint: ^1.94.0
  prettier: ^3.6.0
  vitest: ^5.1.1
  zod: ^4.6.7
  drizzle-orm: 0.45.4
  drizzle-kit: 0.31.11
  pg: ^8.16.0
  '@types/pg': ^8.15.0
  '@types/node': ^24.0.0

allowBuilds:
  '@swc/core': true
  esbuild: true
  '@nestjs/core': true
  # Optional native speed-ups pulled in by testcontainers. Not needed, so not built.
  cpu-features: false
  ssh2: false
  protobufjs: false

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.12'
  - '@turbo/darwin-arm64@2.11.12'
  - '@turbo/linux-64@2.11.12'
  - '@turbo/linux-arm64@2.11.12'
  - '@turbo/windows-64@2.11.12'
  - '@turbo/windows-arm64@2.11.12'
  - turbo@2.11.12
  - '@vitest/mocker@5.1.1'
  - '@vitest/spy@5.1.1'
  - vitest@5.1.1
  - '@tanstack/query-core@5.108.0'
  - '@tanstack/react-query@5.108.0'
